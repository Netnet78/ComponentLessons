<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Lesson 101</title>
    <link rel="stylesheet" href="./button.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

  <body>
    <button class="general-button">
      SUBSCRIBE <i class="fa-solid fa-circle-play"></i>
    </button>
    <button class="general-button like-button">
      LIKE <i class="fa-solid fa-thumbs-up"></i>
    </button>
    <button class="general-button">
      SHARE <i class="fa-solid fa-share"></i>
    </button>
  </body>
</html>
